name: Python Project CI/CD

on:
  push:
    branches: 
      - prod
      - preprod
  pull_request:
    branches:
      - prod
      - preprod

jobs:
  # Job 1: Code Quality & Linting
  lint:
    name: Code Quality & Linting
    runs-on: self-hosted

    steps:      

      - name: Cleanup workspace
        run: rm -rf ${{ github.workspace }}/* 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache pip dependencies
        uses: actions/cache@v4
        id: cache-pip
        with:
          path: /tmp/lint-env
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

        
      - name: Run Python linting
        run: |
          # Create virtual environment
          if [ ! -d "/tmp/lint-env" ]; then
            python3.11 -m venv /tmp/lint-env
          fi
          source /tmp/lint-env/bin/activate
          
          # Install tools and dependencies
          pip install --upgrade pip
          pip install flake8 black isort mypy bandit safety
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          
          # Run all linting tools
          echo "Running Black (Code Formatting)..."
          black --check --diff . || echo "Black formatting issues found"
          
          echo "Running isort (Import Sorting)..."
          isort --check-only --diff . || echo "Import sorting issues found"
          
          echo "Running Flake8 (Linting)..."
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || echo "Flake8 issues found"
          
          echo "Running MyPy (Type scanning)..."
          mypy . --ignore-missing-imports || echo "MyPy issues found (non-blocking)"
          
          echo "Running Bandit (Security Linting)..."
          bandit -r . -x tests/ || echo "Bandit security issues found (non-blocking)"
          
          echo "Running Safety (Dependency Security scan)..."
          safety check || echo "Safety dependency issues found (non-blocking)"

  # Job 2: Build
  build:
    name: Build Python Application
    runs-on: self-hosted
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache pip dependencies
        uses: actions/cache@v4
        id: cache-pip-build
        with:
          path: /tmp/build-env
          key: ${{ runner.os }}-pip-build-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-build-

      - name: Install dependencies and create package
        run: |
          # Create virtual environment
          if [ ! -d "/tmp/build-env" ]; then
            python3.11 -m venv /tmp/build-env
          fi
          source /tmp/build-env/bin/activate
          
          # Install dependencies
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

          # Create a simple package structure if needed
          if [ -f setup.py ]; then
            python setup.py sdist bdist_wheel
          fi

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: python-build
          path: |
            dist/
            *.py
            requirements*.txt
          retention-days: 7

      - name: Build Docker image
        run: |
          sudo docker build . \
            --file Dockerfile \
            --tag job-${{ github.run_id }}:${{ github.sha }} \
            --tag job-${{ github.run_id }}:latest \
            --tag ${{ secrets.DOCKER_USERNAME }}/sfyrisec-refactor-app-image:latest-refactor-api

      - name: Save Docker image as tar
        run: |
          docker save job-${{ github.run_id }}:latest -o image.tar

      - name: Upload Docker image tar
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-tar
          path: image.tar
          retention-days: 1

  # Job 3: Security Scan (Docker Image Only)
  security-scan:
    name: Security Vulnerability Scan
    runs-on: self-hosted
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@v0.2.0
        with:
          cache: true
          version: v0.64.1

      - name: Download Docker image tar
        uses: actions/download-artifact@v4
        with:
          name: docker-image-tar

      - name: Run Trivy vulnerability scanner on Docker image tar
        run: |
          trivy image --input image.tar \
            --format sarif \
            --output trivy-image-results.sarif \
            --severity CRITICAL,HIGH \
            --ignore-unfixed

      - name: Upload Docker image scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-image-results.sarif'

      # Docker image vulnerabilities (table format for logs with exit code)
      - name: Run Trivy on Docker image (fail on critical/high)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'job-${{ github.run_id }}:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          skip-setup-trivy: true
          ignore-unfixed: true

  docker-push:
    name: Push Docker Image to Registry
    runs-on: self-hosted
    needs: [security-scan, build]
    if: github.event_name == 'push'

    steps:
      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | sudo docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Push Docker image to Docker Hub
        run: sudo docker push ${{ secrets.DOCKER_USERNAME }}/sfyrisec-refactor-app-image:latest-refactor-api
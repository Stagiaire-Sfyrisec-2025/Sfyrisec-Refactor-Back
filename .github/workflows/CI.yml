name: Python Project CI/CD

on:
  push:
    branches: 
      - prod
      - preprod
  pull_request:
    branches:
      - prod
      - preprod

jobs:
# Job 1: Code Quality & Linting
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    
    steps:      
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        run: |
          python3.11 --version
          python3.11 -m pip install --upgrade pip
          
      - name: Install linting tools
        run: |
          python3.11 -m pip install flake8 black isort mypy bandit safety
          if [ -f requirements.txt ]; then python3.11 -m pip install -r requirements.txt; fi
        
      - name: Run Black (Code Formatting)
        run: |
          source /tmp/lint-env/bin/activate
          black --check --diff .
        
      - name: Run isort (Import Sorting)
        run: |
          source /tmp/lint-env/bin/activate
          isort --check-only --diff .
        
      - name: Run Flake8 (Linting)
        run: |
          source /tmp/lint-env/bin/activate
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        
      - name: Run MyPy (Type Checking)
        run: |
          source /tmp/lint-env/bin/activate
          mypy . --ignore-missing-imports || true
        
      - name: Run Bandit (Security Linting)
        run: |
          source /tmp/lint-env/bin/activate
          bandit -r . -x tests/ || true
        
      - name: Run Safety (Dependency Security Check)
        run: |
          source /tmp/lint-env/bin/activate
          safety check || true